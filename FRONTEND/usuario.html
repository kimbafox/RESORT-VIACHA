<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfil de Usuario - Paradise Resort</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="overlay">
        <nav class="navbar">
            <img src="assets/logo.png" alt="Logo Resort" class="logo">
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="guia_turistica.html">Guía Turística</a></li>
                <li><a href="calendario.html">Calendario</a></li>
                <li><a href="precios.html">Precios</a></li>
                <li><a href="usuario.html">Mi Perfil </a></li>
            </ul>
        </nav>

        <div class="glass-container">
            <h2>Panel de Usuario </h2>
            <span class="beta-badge">BETA</span>
            <div id="userInfo" style="margin-top: 1.5rem;">
                <img id="profileImage" class="profile-placeholder" src="assets/logo.png" alt="Foto de perfil predeterminada">
                <p><strong>Correo Electrónico:</strong> <span id="displayEmail">No registrado</span></p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('authToken');
            if (!token) {
                window.location.href = 'index.html#login';
                return;
            }
            try {
                const response = await fetch('/api/profile', { headers: { Authorization: `Bearer ${token}` } });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message);
                localStorage.setItem('currentUser', JSON.stringify(data.user));
                document.getElementById('displayEmail').textContent = data.user.email;
                document.getElementById('profileImage').src = data.user.profileImage || 'assets/logo.png';
            } catch (error) {
                localStorage.removeItem('authToken');
                localStorage.removeItem('currentUser');
                window.location.href = 'index.html#login';
            }
        });
    </script>
</body>
</html>
